name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    # Static checks only (ruff check/format + codespell via pre-commit); nothing here needs Isaac Sim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
