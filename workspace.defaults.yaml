# Committed workspace defaults + the catalog of selectable projects. This is the shared, version-
# controlled source of truth; a per-user `workspace.yaml` (gitignored) records the local selection
# (which projects + IsaacLab pip/source). `just setup` opens a picker to generate/change it;
# `resolve_workspace.py` merges this file with that selection into a flat gitman.yaml.
org: hcrl-isaac
isaaclab:
  mode: source         # Isaac Lab 3.0 has no pip release: source (uv-locked clone) | none (don't install)
  ref: v3.0.0-EA       # IsaacLab git ref cloned into resources/IsaacLab
  extras: [rsl-rl, ovphysx, importers, video]   # IsaacLab uv extras synced into the ilab venv
always: [hcrl_isaaclab, robot_rl, hcrl_sim2real]   # repos always present (core extension, RL package, sim2real infra)
# this branch composes every repo's Isaac Lab 3.0 port
refs: {hcrl_isaaclab: feature/isaac-3.0, robot_rl: feature/isaac-3.0, hcrl_sim2real: feature/isaac-3.0, hhlm_tasks: feature/isaac-3.0, ssti_tasks: feature/isaac-3.0, holosoma: feature/isaac-3.0}

# Selectable project task repos (each -> <name>_tasks + its transitive robot/data deps). `default`
# marks the ones pre-checked in the selector and used when no per-user workspace.yaml exists.
available_projects:
  - name: ssti
    description: SSTI traversal + MCP crab tasks
    default: true
  - name: hhlm
    description: Hierarchical humanoid loco-manipulation tasks
    default: true
