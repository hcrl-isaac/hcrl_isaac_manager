# Compute pools `pls res` probes; `kind` picks the backend (local, ssh, slurm, ray). This file ships only this
# machine. Your own pools go in compute.local.toml (gitignored, merged over this file): `pls setup --add <name>
# --kind ssh|ray ...` writes them there, or edit it by hand. SLURM pools come from the cluster profiles
# (scripts/cluster/config/<name>/, made by `pls setup --add <name>`).

[compute.local]
kind = "local"

# Examples for compute.local.toml:
#
# [compute.lab-a100]                  # GPU boxes reached over ssh with a key
# kind = "ssh"
# hosts = ["box1", "box2"]            # short names; `domain` is appended to each
# domain = "lab.example.edu"
# user = "<your login>"
# # pin = "device"                    # runs pick the card by device index, when Kit refuses a masked CUDA_VISIBLE_DEVICES
# # render = true                     # RT-core cards: scripts/larg/train.sh records video in-process
#
# [compute.ray]                       # a Ray cluster; the pool named `ray` is what `pls run --on ray` submits to
# kind = "ray"
# address = "http://<head>:8265"
#
# [compute.delta]                     # a setting over a SLURM pool (the pool itself comes from its profile)
# enabled = false

# Lease windows in minutes (a design choice: the ~15 min stall watchdog plus a relaunch and Kit boot).
[leases]
grace_min = 30
idle_min = 30
